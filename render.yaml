services:
  - type: web
    name: carepath-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_DOCTOR_PASSWORD
        value: Demo@123
      - key: DEMO_ADMIN_PASSWORD
        value: Admin@123
      - key: DEMO_PATIENT_PASSWORD
        value: DemoPatient@123
